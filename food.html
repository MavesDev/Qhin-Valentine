<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Selection</title>
  <link rel="stylesheet" href="css/food.css" />
</head>

<body>
  <div id="foodquestion">
    <b>What's the menu for our little date pookie?</b>
  </div>

  <div class="food-selection">
    <div class="food-item">
      <img src="food/chicken.jpeg" alt="Burgers, fries and fried chicken" />
      <label><input type="checkbox" name="food" value="Burgers, fries and fried chicken" />
        Heavy Meal</label>
    </div>
    <div class="food-item">
      <img src="food/dessert.jpg" alt="dog" />
      <label><input type="checkbox" name="food" value="hotdog" /> Dessert</label>
    </div>
    <div class="food-item">
      <img src="food/snack.jpg" alt="koreanfood" />
      <label><input type="checkbox" name="food" value="Korean food" /> Snack</label>
    </div>
    <div class="food-item">
      <img src="food/drinks.jpg" alt="pasta" />
      <label><input type="checkbox" name="food" value="pasta" /> Drink</label>
    </div>
  </div>
  <button class="button" onclick="location.href='activities.html'">
    Next Quasotion
  </button>
</body>

</html>
